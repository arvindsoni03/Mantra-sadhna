<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navarna Sadhana Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@1&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050000; touch-action: manipulation; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(30, 0, 0, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 215, 0, 0.2); }
        .mantra-font { font-family: 'Lora', serif; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100%; display: flex; flex-col; justify-content: space-between; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <div class="ui-layer p-4 md:p-8">
        <header class="flex justify-between items-start">
            <div class="glass p-3 rounded-xl interactive">
                <h1 class="text-lg md:text-xl font-bold tracking-widest text-orange-500 uppercase">Sadhana</h1>
                <p class="text-[8px] md:text-[10px] opacity-60">NAVVARNA MANTRA</p>
            </div>
            
            <div class="glass p-3 rounded-xl text-center interactive">
                <p class="text-[10px] uppercase opacity-70">Mala Count</p>
                <div class="flex items-baseline gap-1">
                    <span id="counter" class="text-3xl font-bold text-yellow-500">0</span>
                    <span class="text-xs opacity-40">/ 108</span>
                </div>
            </div>
        </header>

        <div class="text-center px-4">
            <p id="mantra-display" class="mantra-font text-lg md:text-2xl text-orange-100 opacity-90 italic leading-relaxed">
                "Aim Hrīm Klīm Chāmundāyai Vicce"
            </p>
        </div>

        <footer class="flex flex-col items-center gap-6 pb-6 md:pb-12">
            <div class="w-full max-w-xs h-1 bg-black/40 rounded-full overflow-hidden interactive">
                <div id="progress" class="h-full bg-gradient-to-r from-red-800 via-orange-500 to-yellow-400 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="flex items-center gap-4 interactive">
                <button onclick="performJapa()" class="w-24 h-24 md:w-32 md:h-32 rounded-full glass border-2 border-orange-500/50 flex items-center justify-center active:scale-90 transition-transform shadow-[0_0_20px_rgba(255,100,0,0.2)]">
                    <span class="text-xs font-bold tracking-widest text-orange-200">CHANT</span>
                </button>
                
                <button onclick="resetMala()" class="p-4 rounded-full glass opacity-50 hover:opacity-100 active:rotate-180 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <div id="container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, light, core;
        let count = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080000);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for mobile performance
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0x200000, 1.5);
            scene.add(ambient);

            light = new THREE.PointLight(0xff5500, 3, 10);
            light.position.set(0, 1, 1);
            scene.add(light);

            // Geometric "Divine Center"
            const geo = new THREE.IcosahedronGeometry(0.8, 2);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xff2200, 
                wireframe: true, 
                emissive: 0xff0000, 
                emissiveIntensity: 1 
            });
            core = new THREE.Mesh(geo, mat);
            core.position.y = 1.2;
            scene.add(core);

            // Ground
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.5 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            core.rotation.y += 0.005;
            core.position.y = 1.2 + Math.sin(time) * 0.1; // Hover effect
            light.intensity = 2 + Math.random() * 0.5;
            
            renderer.render(scene, camera);
        }

        window.performJapa = () => {
            if (count < 108) {
                count++;
                updateUI();
                // Haptic feedback (Mobile only)
                if (navigator.vibrate) navigator.vibrate(20);
                
                // Visual Pulse
                core.scale.setScalar(1.4);
                setTimeout(() => core.scale.setScalar(1), 100);
            }
        };

        window.resetMala = () => {
            if(confirm("Start new mala?")) {
                count = 0;
                updateUI();
            }
        };

        function updateUI() {
            document.getElementById('counter').innerText = count;
            document.getElementById('progress').style.width = (count / 108 * 100) + "%";
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        animate();
    </script>
</body>
</html>
